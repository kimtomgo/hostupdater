name: Build Host Updater APK (ImmortalWrt AX6)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'files/**'
      - 'luasrc/**'
      - '.github/workflows/hostupdater-apk.yml'

permissions:
  contents: read

concurrency:
  group: hostupdater-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout hostupdater
        uses: actions/checkout@v4
        with:
          path: hostupdater

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget zstd

      - name: Download ImmortalWrt qualcommax/ipq807x SDK
        env:
          SDK_URL: https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq807x/immortalwrt-sdk-qualcommax-ipq807x_gcc-14.4.0_musl.Linux-x86_64.tar.zst
        run: |
          mkdir -p sdk
          wget --https-only --retry-connrefused --waitretry=3 --tries=5 \
            "$SDK_URL" -O /tmp/immortalwrt-sdk.tar.zst
          tar --use-compress-program=unzstd -xf /tmp/immortalwrt-sdk.tar.zst -C sdk --strip-components=1
          test -f sdk/include/toplevel.mk
          echo "SDK extracted"

      - name: Prepare package in SDK
        run: |
          mkdir -p sdk/package/utils/hostupdater
          cp -a hostupdater/Makefile hostupdater/files hostupdater/luasrc sdk/package/utils/hostupdater/
          if [ -f hostupdater/LICENSE ]; then
            cp hostupdater/LICENSE sdk/package/utils/hostupdater/
          fi
          test -f sdk/package/utils/hostupdater/Makefile

      - name: Build hostupdater APK
        working-directory: sdk
        run: |
          make package/hostupdater/compile V=s -j"$(nproc)"

      - name: Verify package output
        id: package
        run: |
          mapfile -t packages < <(find sdk/bin/packages -type f -name 'hostupdater-*.apk' -print)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No hostupdater APK produced"
            find sdk/bin -maxdepth 5 -type f | sort | tail -100
            exit 1
          fi
          mkdir -p output
          for pkg in "${packages[@]}"; do
            cp "$pkg" output/
            sha256sum "$pkg"
          done
          ls -lh output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostupdater-immortalwrt-qualcommax-ipq807x-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
